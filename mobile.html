<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>기타 트레이너 Pro (Mobile)</title>
    <style>
        :root { 
            --fret-gold: #c5a059; 
            --wood: #2c1e14; 
            --string-base: #bdc3c7; 
            --dot: #ffffff; 
            --primary: #4a90e2;
            --vh: 1vh; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #000; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; 
            height: calc(var(--vh, 1vh) * 100); 
            overflow: hidden; 
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .header { background: #fff; padding: 5px 15px; display: flex; align-items: center; justify-content: space-between; height: 70px; z-index: 100; }
        select { padding: 8px; border-radius: 8px; border: 2px solid var(--primary); font-size: 0.8rem; background: white; }
        .quiz-info { text-align: center; flex-grow: 1; }
        .target-note { font-size: 2.2rem; font-weight: 900; color: #2c3e50; line-height: 1; }
        .target-desc { font-size: 0.7rem; color: #7f8c8d; }

        .fretboard-wrapper { flex-grow: 1; overflow-x: auto; background: #1a1a1a; display: flex; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .fretboard { position: relative; display: flex; width: 1550px; height: 80%; max-height: 300px; background: var(--wood); border-top: 4px solid #444; border-bottom: 4px solid #444; }
        
        .fret { flex: 1; border-right: 3px solid var(--fret-gold); position: relative; z-index: 1; }
        .fret:first-child { border-right: 10px solid #ddd; flex: 0.5; }
        .fret-num { position: absolute; top: -25px; width: 100%; text-align: center; color: #999; font-size: 0.8rem; font-weight: bold; }

        /* 인레이 강화 */
        .inlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; background: var(--dot); border-radius: 50%; opacity: 0.7; z-index: 2; pointer-events: none; }
        .inlay-12-top { transform: translate(-50%, -160%); }
        .inlay-12-bottom { transform: translate(-50%, 60%); }

        .strings { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-around; pointer-events: none; z-index: 3; }
        .string { background: var(--string-base); width: 100%; box-shadow: 0 1px 1px rgba(0,0,0,0.5); }
        .string-1 { height: 1px; } .string-2 { height: 1.2px; } .string-3 { height: 1.8px; }
        .string-4 { height: 2.8px; } .string-5 { height: 3.8px; } .string-6 { height: 5.5px; }

        .node { position: absolute; width: 44px; height: 44px; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 1.1rem; font-weight: bold; }
        .node.correct { background: #27ae60; color: white !important; }
        .node.wrong { background: #e74c3c; color: white !important; }
        .node.dimmed { opacity: 0.1; pointer-events: none; }

        .status-bar { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); color: #fff; padding: 10px; font-size: 0.9rem; text-align: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        
        @media screen and (orientation: portrait) { 
            .portrait-warning { display: flex !important; position: fixed; top:0; left:0; width:100%; height:100%; background: #111; color: #fff; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; } 
        }
        .portrait-warning { display: none; }
    </style>
</head>
<body>

<div class="portrait-warning">
    <div style="font-size: 4rem; margin-bottom: 15px;">🎸</div>
    <h2>가로 모드로 돌려주세요</h2>
    <p>기타 지판을 넓게 보려면 가로 모드가 필수입니다.</p>
</div>

<div class="header">
    <select id="modeSelect" onchange="changeMode(this.value)">
        <option value="ALL">전체 찾기</option>
        <option value="RANDOM">랜덤 줄</option>
        <option value="MASTER">한 줄 정복</option>
    </select>
    
    <div class="quiz-info">
        <div id="target-note" class="target-note">-</div>
        <div id="target-desc" class="target-desc">-</div>
    </div>
    
    <a href="index.html" style="text-decoration:none; font-size:0.7rem; color:#666; border:1px solid #ccc; padding:5px; border-radius:5px;">PC버전</a>
</div>

<div class="fretboard-wrapper">
    <div class="fretboard" id="fretboard"></div>
</div>

<div id="status" class="status-bar">시작하려면 음을 확인하세요!</div>

<script>
    function setScreenSize() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setScreenSize();
    window.addEventListener('resize', setScreenSize);

    const noteNames = ["E", "F", "F#", "G", "G#", "A", "A#", "B", "C", "C#", "D", "D#"];
    const stringRoots = [0, 7, 3, 10, 5, 0];
    const quizNotes = ["C", "D", "E", "F", "G", "A", "B"];
    const inlays = [3, 5, 7, 9, 12, 15];

    let currentMode = 'ALL';
    let currentTargetNote = "";
    let currentTargetString = 0;
    let selectedMaster = 2;
    let foundCount = 0;
    let totalToFind = 0;

    function init() {
        const board = document.getElementById('fretboard');
        board.innerHTML = "";
        for (let f = 0; f <= 15; f++) {
            const fretDiv = document.createElement('div');
            fretDiv.className = 'fret';
            fretDiv.innerHTML = `<div class="fret-num">${f===0?'N':f}</div>`;
            
            if (inlays.includes(f)) {
                if (f===12) fretDiv.innerHTML += `<div class="inlay inlay-12-top"></div><div class="inlay inlay-12-bottom"></div>`;
                else fretDiv.innerHTML += `<div class="inlay"></div>`;
            }

            for (let s = 1; s <= 6; s++) {
                const node = document.createElement('div');
                node.className = `node node-s${s}`;
                node.style.top = ((s - 0.5) * (100 / 6)) + "%";
                node.style.left = (f === 0 ? "25%" : "50%");
                const noteIdx = (stringRoots[s-1] + f) % 12;
                node.dataset.note = noteNames[noteIdx];
                node.dataset.string = s;
                node.dataset.fret = f;
                
                const handler = (e) => { e.preventDefault(); handle(node, node.dataset.note, s, f); };
                node.addEventListener('touchstart', handler);
                node.addEventListener('mousedown', () => handle(node, node.dataset.note, s, f));
                fretDiv.appendChild(node);
            }
            board.appendChild(fretDiv);
        }
        const sDiv = document.createElement('div');
        sDiv.className = 'strings';
        for(let i=1; i<=6; i++) {
            const str = document.createElement('div');
            str.className = `string string-${i}`;
            sDiv.appendChild(str);
        }
        board.appendChild(sDiv);
    }

    function handle(node, note, s, f) {
        if (f > 12 || (currentMode === 'MASTER' && s !== selectedMaster) || node.classList.contains('correct')) return;
        if (note === currentTargetNote && (currentMode === 'RANDOM' ? s === currentTargetString : true)) {
            node.classList.add('correct');
            node.innerText = note;
            foundCount++;
            document.getElementById('status').innerText = `남은 개수: ${totalToFind - foundCount}`;
            if (foundCount === totalToFind) { 
                document.getElementById('status').innerText = "🎉 성공! 다음 문제..."; 
                setTimeout(startNewQuiz, 1000); 
            }
        } else {
            node.classList.add('wrong');
            node.innerText = note;
            setTimeout(() => { node.classList.remove('wrong'); node.innerText = ""; }, 600);
        }
    }

    function changeMode(m) { currentMode = m; startNewQuiz(); }

    function startNewQuiz() {
        const nodes = document.querySelectorAll('.node');
        nodes.forEach(n => {
            n.classList.remove('correct', 'wrong');
            n.innerText = "";
            if (currentMode === 'MASTER') n.classList.toggle('dimmed', parseInt(n.dataset.string) !== selectedMaster);
            else n.classList.remove('dimmed');
        });
        currentTargetNote = quizNotes[Math.floor(Math.random() * quizNotes.length)];
        document.getElementById('target-note').innerText = currentTargetNote;
        
        if (currentMode === 'ALL') {
            document.getElementById('target-desc').innerText = "0-12F 전체 찾기";
            totalToFind = Array.from(nodes).filter(n => n.dataset.note === currentTargetNote && parseInt(n.dataset.fret) <= 12).length;
        } else if (currentMode === 'RANDOM') {
            currentTargetString = Math.floor(Math.random() * 6) + 1;
            document.getElementById('target-desc').innerText = `${currentTargetString}번 줄에서 찾기`;
            totalToFind = Array.from(nodes).filter(n => n.dataset.note === currentTargetNote && parseInt(n.dataset.string) === currentTargetString && parseInt(n.dataset.fret) <= 12).length;
        } else {
            document.getElementById('target-desc').innerText = `${selectedMaster}번 줄 훈련`;
            totalToFind = Array.from(nodes).filter(n => n.dataset.note === currentTargetNote && parseInt(n.dataset.string) === selectedMaster && parseInt(n.dataset.fret) <= 12).length;
        }
        foundCount = 0;
        document.getElementById('status').innerText = `남은 개수: ${totalToFind}`;
    }

    init();
    startNewQuiz();
</script>
</body>
</html>
