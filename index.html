<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기타 지판 트레이너 Pro (Master)</title>
    <style>
        :root { --primary: #4a90e2; --wood: #2c1e14; --fret: #c5a059; --string: #bdc3c7; --dot: #ecf0f1; }
        body { font-family: 'Pretendard', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 98%; max-width: 1400px; }
        
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .tab { padding: 12px 25px; border: none; border-radius: 10px; background: #eee; cursor: pointer; font-weight: bold; }
        .tab.active { background: var(--primary); color: white; }

        .config-panel { background: #f8f9fa; padding: 20px; border-radius: 15px; margin-bottom: 25px; }
        .btn { padding: 8px 18px; border: 2px solid var(--primary); border-radius: 20px; background: white; color: var(--primary); cursor: pointer; font-weight: bold; }
        .btn.active { background: var(--primary); color: white; }
        .acc-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .acc-label { font-weight: bold; color: #555; margin-right: 2px; }
        .str-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ddd; color: #666; font-weight: bold; cursor: pointer; }
        .str-btn.active { background: #2c3e50; color: white; border-color: #2c3e50; }

        .target-note { font-size: 5rem; font-weight: 900; color: #2c3e50; text-align: center; margin: 10px 0; }
        .status-msg { text-align: center; font-weight: bold; color: #555; height: 25px; }

        .fretboard-wrap { overflow-x: auto; background: #1a1a1a; padding: 50px 0; border-radius: 15px; position: relative; }
        .fretboard { position: relative; display: flex; width: 2300px; height: 240px; background: var(--wood); border-top: 5px solid #444; border-bottom: 5px solid #444; margin: 0 auto; overflow:visible; }
        
        /* 줄 레이어 z-index 1로 고정 */
        .string-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
        .string { 
            position: absolute;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, #f5f5f5, #8a8a8a);
            box-shadow: 0 1px 4px rgba(0,0,0,0.9);
            border-radius: 999px;
            transition: opacity 0.3s;
        }
        .s1 { top: 8%; height: 1.2px; }
        .s2 { top: 25%; height: 1.8px; }
        .s3 { top: 42%; height: 2.8px; }
        .s4 { top: 58%; height: 4px; }
        .s5 { top: 75%; height: 5.5px; }
        .s6 { top: 91%; height: 7px; }
        .string.dimmed { opacity: 0.1; }

        /* fret의 z-index를 아예 제거하여 자식(node)이 컨텍스트에 갇히지 않게 함 */
        .fret { flex: 1; border-right: 4px solid var(--fret); position: relative; }
        .fret:first-child { border-right: 12px solid #ddd; flex: 0.5; } 
        .inlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: var(--dot); border-radius: 50%; opacity: 0.8; box-shadow: 0 0 10px #fff; }
        .inlay-12-top { transform: translate(-50%, -180%); }
        .inlay-12-bottom { transform: translate(-50%, 80%); }

        /* 음표시 레이어 z-index 10으로 올려서 줄(z-index 1) 위로 덮음 */
        .node { position: absolute; width: 42px; height: 42px; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; font-weight: bold; color: transparent; }
        .node.correct { background: #27ae60 !important; color: white !important; animation: popCorrect 0.22s ease; }
        .node.wrong { background: #e74c3c !important; color: white !important; animation: shakeWrong 0.25s ease; }
        @keyframes popCorrect { 0% { transform: translate(-50%, -50%) scale(0.82); } 70% { transform: translate(-50%, -50%) scale(1.18); } 100% { transform: translate(-50%, -50%) scale(1); } }
        @keyframes shakeWrong { 0%,100% { transform: translate(-50%, -50%); } 25% { transform: translate(calc(-50% - 5px), -50%); } 75% { transform: translate(calc(-50% + 5px), -50%); } }
        .node.dimmed { opacity: 0.05; pointer-events: none; }
        .node.root-found { background: #4a90e2 !important; color: white !important; box-shadow: 0 0 0 4px rgba(74,144,226,.18); }
        .node.third-found { background: #f39c12 !important; color: white !important; box-shadow: 0 0 0 4px rgba(243,156,18,.18); }
        .third-panel { display:none; margin-top:18px; padding-top:18px; border-top:1px solid #e6eaf0; }
        .third-panel.show { display:block; }
        .third-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:10px; }
        .third-note-btn { min-width:52px; padding:8px 10px; border-radius:14px; }
        .third-help { color:#777; font-size:.9rem; line-height:1.45; margin-top:10px; }
        .third-root-text { color:#4a90e2; }
        .third-target-text { color:#f39c12; }
        .fret-num { position: absolute; top: -35px; width: 100%; text-align: center; color: #aaa; font-weight: bold; font-size: 0.9rem; letter-spacing: .02em; z-index: 12; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
        .fretboard.hide-fret-nums .fret-num { opacity: 0; transform: translateY(-5px); }
    </style>

<body>

<div class="container">
    <div class="mode-tabs">
        <button id="tab-ALL" class="tab active" onclick="switchMode('ALL')">한 음 싹 다 찾기</button>
        <button id="tab-ONE" class="tab" onclick="switchMode('ONE')">한 줄 마스터</button>
        <button id="tab-MULTI" class="tab" onclick="switchMode('MULTI')">다중 줄 연습</button>
        <button id="tab-SEQ" class="tab" onclick="switchMode('SEQ')">6→1→6 순차</button>
        <button id="tab-THIRD" class="tab" onclick="switchMode('THIRD')">3도 찾기</button>
    </div>

    <div class="config-panel">
        <div style="display:flex; align-items:center; gap:20px;">
        <div style="margin-left:auto;">
            <a href="mobile.html" class="btn" style="text-decoration:none; display:inline-flex; align-items:center;">
                모바일 버전 열기
            </a>
        </div>
            <div class="acc-group" id="acc-group">
                <span class="acc-label">음 선택</span>
                <button id="acc-natural" class="btn active" onclick="toggleNoteType('natural')">기본</button>
                <button id="acc-sharp" class="btn" onclick="toggleNoteType('sharp')">#</button>
                <button id="acc-flat" class="btn" onclick="toggleNoteType('flat')">b</button>
            </div>
            <button id="fret-num-btn" class="btn active" onclick="toggleFretNumbers()">프렛번호 ON</button>
            <div id="str-ctrl" style="display:none; align-items:center; gap:15px;">
                <span id="bulk-ctrl">
                    <button class="btn" style="border-color:#ccc; color:#666;" onclick="allStrings(true)">전체선택</button>
                    <button class="btn" style="border-color:#ccc; color:#666;" onclick="allStrings(false)">전체해제</button>
                </span>
                <div id="str-btns"></div>
            </div>
        </div>

        <div id="third-panel" class="third-panel">
            <div class="third-row">
                <span class="acc-label">3도 퀴즈 방식</span>
                <button id="third-mode-RANDOM" class="btn active" onclick="setThirdMode('RANDOM')">랜덤</button>
                <button id="third-mode-FIXED_NOTE" class="btn" onclick="setThirdMode('FIXED_NOTE')">정해진 음</button>
                <button id="third-mode-FIXED_STRING" class="btn" onclick="setThirdMode('FIXED_STRING')">정해진 줄</button>
                <button id="third-mode-FIXED_BOTH" class="btn" onclick="setThirdMode('FIXED_BOTH')">음 + 줄</button>
                <button id="third-mode-SEQ" class="btn" onclick="setThirdMode('SEQ')">순차 전부</button>
            </div>
            <div class="third-row">
                <span class="acc-label">루트 음</span>
                <div id="third-note-btns" class="third-row" style="margin-top:0;"></div>
            </div>
            <div class="third-row">
                <span class="acc-label">출제 줄</span>
                <button class="btn" style="border-color:#ccc; color:#666;" onclick="thirdAllStrings(true)">전체선택</button>
                <button class="btn" style="border-color:#ccc; color:#666;" onclick="thirdAllStrings(false)">전체해제</button>
                <div id="third-str-btns" class="third-row" style="margin-top:0;"></div>
            </div>
            <div class="third-help">
                1단계: 제시된 줄에서 루트음을 직접 찾습니다. 2단계: 그 루트 기준 장3도 음을 동일줄, 한 줄 위/두꺼운 쪽, 한 줄 아래/얇은 쪽에서 찾습니다. 6번줄과 1번줄은 없는 방향을 자동 제외합니다.
            </div>
        </div>
    </div>

    <div id="target-desc" style="text-align:center; color:#7f8c8d; font-weight:bold;">지판 전체에서 다음 음을 모두 찾으세요</div>
    <div class="target-note" id="target-note">-</div>
    <div id="status" class="status-msg">남은 개수: -</div>

    <div class="fretboard-wrap">
        <div class="fretboard" id="fretboard">
            <div class="string-layer" id="string-layer">
                <div class="string s6"></div><div class="string s5"></div><div class="string s4"></div>
                <div class="string s3"></div><div class="string s2"></div><div class="string s1"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const noteNames = ["E", "F", "F#", "G", "G#", "A", "A#", "B", "C", "C#", "D", "D#"];
    const altNames = { "F#":"Gb", "G#":"Ab", "A#":"Bb", "C#":"Db", "D#":"Eb" };
    const naturalNames = noteNames.filter(n => !n.includes('#'));
    const sharpNames = noteNames.filter(n => n.includes('#'));
    const flatNames = Object.values(altNames);

    function getNotePool() {
        let pool = [];
        if(noteTypeEnabled.natural) pool = pool.concat(naturalNames);
        if(noteTypeEnabled.sharp) pool = pool.concat(sharpNames);
        if(noteTypeEnabled.flat) pool = pool.concat(flatNames);
        return pool.length ? pool : naturalNames;
    }

    function updateNoteTypeButtons() {
        document.getElementById('acc-natural').classList.toggle('active', noteTypeEnabled.natural);
        document.getElementById('acc-sharp').classList.toggle('active', noteTypeEnabled.sharp);
        document.getElementById('acc-flat').classList.toggle('active', noteTypeEnabled.flat);
    }

    function getNoteTypeLabel() {
        const labels = [];
        if(noteTypeEnabled.natural) labels.push('기본');
        if(noteTypeEnabled.sharp) labels.push('#');
        if(noteTypeEnabled.flat) labels.push('b');
        return labels.join(' + ');
    }

    function toggleNoteType(type) {
        const enabledCount = Object.values(noteTypeEnabled).filter(Boolean).length;
        if(noteTypeEnabled[type] && enabledCount === 1) return; // 최소 하나는 항상 켜두기
        noteTypeEnabled[type] = !noteTypeEnabled[type];
        updateNoteTypeButtons();
        newQuiz();
    }

    function matchesTarget(n) {
        return n.dataset.n1 === targetNote || n.dataset.n2 === targetNote;
    }

    function updateFretNumberVisibility() {
        const board = document.getElementById('fretboard');
        const btn = document.getElementById('fret-num-btn');
        if(board) board.classList.toggle('hide-fret-nums', !showFretNumbers);
        if(btn) {
            btn.classList.toggle('active', showFretNumbers);
            btn.innerText = showFretNumbers ? '프렛번호 ON' : '프렛번호 OFF';
        }
    }

    function toggleFretNumbers() {
        showFretNumbers = !showFretNumbers;
        updateFretNumberVisibility();
    }

    
    // 정확한 표준 튜닝 (1번줄부터 6번줄 순서: E, B, G, D, A, E)
    // 0:E, 7:B, 3:G, 10:D, 5:A, 0:E
    const stringRoots = [0, 7, 3, 10, 5, 0];
    const MAX_FRET = 24;
    
    let currentMode = 'ALL';
    let thirdMode = 'RANDOM';
    let thirdFixedNote = 'C';
    let thirdSelectedNotes = ['C'];
    let thirdActiveStrings = [true, true, true, true, true, true];
    let thirdPhase = 'ROOT';
    let thirdRootNote = 'C', thirdRootString = 6, thirdRootFret = -1, thirdTargetNote = 'E';
    let thirdTargets = [], thirdSeqQueue = [], thirdSeqIndex = 0;
    let showFretNumbers = true;
    let noteTypeEnabled = { natural: true, sharp: false, flat: false };
    let activeOne = 1, activeMulti = [true, true, true, true, true, true];
    let targetNote = "", targetStrNum = -1, foundCount = 0, totalToFind = 0;
    const seqOrders = [[6,5,4,3,2,1], [1,2,3,4,5,6]];
    let seqPhase = 0, seqIndex = 0;

    function init() {
        const btnBox = document.getElementById('str-btns');
        for(let i=1; i<=6; i++) {
            const b = document.createElement('button');
            b.className = 'str-btn'; b.id = `sbtn-${i}`; b.innerText = i;
            b.onclick = () => {
                if(currentMode === 'ONE') activeOne = i;
                else activeMulti[i-1] = !activeMulti[i-1];
                updateUI(); newQuiz();
            };
            btnBox.appendChild(b);
        }
        initThirdControls();
        updateNoteTypeButtons();
        updateFretNumberVisibility();
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('fretboard');
        const strLayer = document.getElementById('string-layer');
        board.innerHTML = ""; board.appendChild(strLayer);

        for(let f=0; f<=MAX_FRET; f++) {
            const fd = document.createElement('div'); fd.className = 'fret';
            fd.innerHTML = `<div class="fret-num">${f===0?'NUT':f}</div>`;
            
            if([3,5,7,9,12,15,17,19,21,24].includes(f)) {
                if(f===12) {
                    fd.innerHTML += `<div class="inlay inlay-12-top"></div><div class="inlay inlay-12-bottom"></div>`;
                } else {
                    fd.innerHTML += `<div class="inlay"></div>`;
                }
            }

            for(let s=1; s<=6; s++) {
                const n = document.createElement('div'); n.className = 'node';
                n.style.top = `${(s-0.5)*(100/6)}%`;
                // 0프렛을 포함하여 모든 프렛의 노드를 정중앙(50%)에 맞춤
                n.style.left = "50%";
                
                // 정확한 음 계산 (s는 1~6번 줄)
                const idx = (stringRoots[s-1] + f) % 12;
                n.dataset.n1 = noteNames[idx];
                n.dataset.n2 = altNames[noteNames[idx]] || "";
                n.dataset.s = s; 
                n.dataset.f = f;
                n.onclick = () => check(n); fd.appendChild(n);
            }
            board.appendChild(fd);
        }
        updateFretNumberVisibility();
        updateUI(); newQuiz();
    }

    function switchMode(m) {
        currentMode = m;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === `tab-${m}`));
        document.getElementById('str-ctrl').style.display = (m === 'ALL' || m === 'SEQ' || m === 'THIRD' ? 'none' : 'flex');
        document.getElementById('bulk-ctrl').style.display = (m === 'MULTI' ? 'inline' : 'none');
        document.getElementById('third-panel').classList.toggle('show', m === 'THIRD');
        updateUI(); newQuiz();
    }

    function isStringActive(i) {
        if(currentMode === 'ALL') return true;
        if(currentMode === 'ONE') return activeOne === i;
        if(currentMode === 'MULTI') return activeMulti[i-1];
        if(currentMode === 'SEQ') return targetStrNum === i;
        if(currentMode === 'THIRD') return isThirdStringVisible(i);
        return true;
    }

    function isNodeDisabled(n) {
        const f = parseInt(n.dataset.f);
        const s = parseInt(n.dataset.s);
        if(currentMode === 'THIRD') return isThirdNodeDisabled(s, f);
        if(f > 12) return true;
        if(currentMode === 'ONE' || currentMode === 'MULTI' || currentMode === 'SEQ') return s !== targetStrNum;
        return false;
    }

    function updateUI() {
        for(let i=1; i<=6; i++) {
            const b = document.getElementById(`sbtn-${i}`);
            if(b) b.classList.toggle('active', isStringActive(i));
            const strLine = document.querySelector(`.string.s${i}`);
            if(strLine) strLine.classList.toggle('dimmed', !isStringActive(i));
        }
        document.querySelectorAll('.node').forEach(n => n.classList.toggle('dimmed', isNodeDisabled(n)));
    }

    function check(n) {
        if(currentMode === 'THIRD') return checkThird(n);
        if(parseInt(n.dataset.f) > 12 || n.classList.contains('correct')) return;
        const s = parseInt(n.dataset.s);
        if((currentMode === 'ONE' || currentMode === 'MULTI' || currentMode === 'SEQ') && s !== targetStrNum) return;

        if(matchesTarget(n)) {
            n.classList.add('correct'); n.innerText = targetNote;
            foundCount++; updateScore();
            if(foundCount >= totalToFind) {
                setTimeout(() => currentMode === 'SEQ' ? nextSeqStep() : newQuiz(), 700);
            }
        } else {
            n.classList.add('wrong'); n.innerText = n.dataset.n1;
            setTimeout(() => { n.classList.remove('wrong'); n.innerText = ""; }, 500);
        }
    }

    function newQuiz() {
        if(currentMode === 'THIRD') return newThirdQuiz();
        const nodes = document.querySelectorAll('.node');
        nodes.forEach(n => {
            n.classList.remove('correct','wrong'); n.innerText = "";
            const s = parseInt(n.dataset.s);
            const isDim = (parseInt(n.dataset.f) > 12) || (currentMode === 'ONE' && s !== activeOne) || (currentMode === 'MULTI' && !activeMulti[s-1]);
            n.classList.toggle('dimmed', isDim);
        });

        let pool = getNotePool();
        targetNote = pool[Math.floor(Math.random()*pool.length)];
        
        if(currentMode === 'ALL') {
            targetStrNum = -1;
            document.getElementById('target-desc').innerText = "지판 전체(0-12F)에서 찾기";
            totalToFind = Array.from(nodes).filter(n => parseInt(n.dataset.f) <= 12 && matchesTarget(n)).length;
        } else if(currentMode === 'SEQ') {
            seqPhase = 0; seqIndex = 0;
            targetStrNum = seqOrders[seqPhase][seqIndex];
            document.getElementById('target-desc').innerText = seqDesc();
            totalToFind = countOnString(targetStrNum, nodes);
        } else {
            const activeIdxs = (currentMode === 'ONE') ? [activeOne] : activeMulti.map((v,i)=>v?i+1:null).filter(v=>v);
            if(activeIdxs.length === 0) return;
            targetStrNum = activeIdxs[Math.floor(Math.random()*activeIdxs.length)];
            document.getElementById('target-desc').innerText = `${targetStrNum}번 줄에서 찾기`;
            totalToFind = countOnString(targetStrNum, nodes);
        }
        if(totalToFind === 0) return newQuiz();
        document.getElementById('target-note').innerText = targetNote;
        foundCount = 0; updateScore(); updateUI();
    }

    function countOnString(stringNum, nodes = document.querySelectorAll('.node')) {
        return Array.from(nodes).filter(n => parseInt(n.dataset.s) === stringNum && parseInt(n.dataset.f) <= 12 && matchesTarget(n)).length;
    }

    function seqDesc() {
        const dir = seqPhase === 0 ? '하행 6→1' : '상행 1→6';
        return `${dir} · ${targetStrNum}번 줄에서 찾기`;
    }

    function nextSeqStep() {
        seqIndex++;
        if(seqIndex >= seqOrders[seqPhase].length) {
            if(seqPhase === 0) {
                seqPhase = 1; seqIndex = 0;
            } else {
                return newQuiz();
            }
        }
        targetStrNum = seqOrders[seqPhase][seqIndex];
        document.querySelectorAll('.node').forEach(n => { n.classList.remove('correct','wrong'); n.innerText = ""; });
        totalToFind = countOnString(targetStrNum);
        foundCount = 0;
        document.getElementById('target-desc').innerText = seqDesc();
        updateScore(); updateUI();
        if(totalToFind === 0) nextSeqStep();
    }

    function updateScore() {
        if(currentMode === 'THIRD') return updateThirdStatus();
        const range = `출제: ${getNoteTypeLabel()}`;
        if(currentMode === 'SEQ') {
            const step = seqPhase * 6 + seqIndex + 1;
            document.getElementById('status').innerText = `${range} · 단계 ${step}/12 · 남은 개수: ${totalToFind - foundCount}`;
        } else {
            document.getElementById('status').innerText = `${range} · 남은 개수: ${totalToFind - foundCount}`;
        }
    }

    function canonicalNote(n) {
        const inverse = {};
        Object.keys(altNames).forEach(k => inverse[altNames[k]] = k);
        return inverse[n] || n;
    }

    function noteLabel(n) {
        return altNames[n] ? `${n}/${altNames[n]}` : n;
    }

    function noteIndex(n) {
        return noteNames.indexOf(canonicalNote(n));
    }

    function transpose(n, semitones) {
        return noteNames[(noteIndex(n) + semitones + 120) % 12];
    }

    function nodeMatchesNote(node, note) {
        const cn = canonicalNote(note);
        return node.dataset.n1 === cn || node.dataset.n2 === note || node.dataset.n2 === altNames[cn];
    }

    function normalizeFret(f) {
        while(f < 0) f += 12;
        return f;
    }

    function initThirdControls() {
        const noteBox = document.getElementById('third-note-btns');
        noteNames.forEach(n => {
            const b = document.createElement('button');
            b.className = 'btn third-note-btn';
            b.id = `third-note-${n.replace('#','s')}`;
            b.innerText = noteLabel(n);
            b.onclick = () => selectThirdNote(n);
            noteBox.appendChild(b);
        });

        const strBox = document.getElementById('third-str-btns');
        for(let i=1; i<=6; i++) {
            const b = document.createElement('button');
            b.className = 'str-btn active';
            b.id = `third-sbtn-${i}`;
            b.innerText = i;
            b.onclick = () => toggleThirdString(i);
            strBox.appendChild(b);
        }
        updateThirdControls();
    }

    function setThirdMode(m) {
        thirdMode = m;
        thirdSeqQueue = [];
        thirdSeqIndex = 0;
        updateThirdControls();
        if(currentMode === 'THIRD') newQuiz();
    }

    function selectThirdNote(n) {
        const onCount = thirdSelectedNotes.length;
        if(thirdSelectedNotes.includes(n) && onCount === 1) return;
        if(thirdSelectedNotes.includes(n)) {
            thirdSelectedNotes = thirdSelectedNotes.filter(x => x !== n);
        } else {
            thirdSelectedNotes.push(n);
        }
        thirdFixedNote = thirdSelectedNotes[0];
        thirdSeqQueue = [];
        thirdSeqIndex = 0;
        updateThirdControls();
        if(currentMode === 'THIRD') newQuiz();
    }

    function toggleThirdString(i) {
        const onCount = thirdActiveStrings.filter(Boolean).length;
        if(thirdActiveStrings[i-1] && onCount === 1) return;
        thirdActiveStrings[i-1] = !thirdActiveStrings[i-1];
        thirdSeqQueue = [];
        thirdSeqIndex = 0;
        updateThirdControls();
        if(currentMode === 'THIRD') newQuiz();
    }

    function thirdAllStrings(v) {
        thirdActiveStrings = thirdActiveStrings.map(() => v);
        if(!thirdActiveStrings.some(Boolean)) thirdActiveStrings[5] = true;
        thirdSeqQueue = [];
        thirdSeqIndex = 0;
        updateThirdControls();
        if(currentMode === 'THIRD') newQuiz();
    }

    function updateThirdControls() {
        ['RANDOM','FIXED_NOTE','FIXED_STRING','FIXED_BOTH','SEQ'].forEach(m => {
            const b = document.getElementById(`third-mode-${m}`);
            if(b) b.classList.toggle('active', thirdMode === m);
        });
        noteNames.forEach(n => {
            const b = document.getElementById(`third-note-${n.replace('#','s')}`);
            if(b) b.classList.toggle('active', thirdSelectedNotes.includes(n));
        });
        for(let i=1; i<=6; i++) {
            const b = document.getElementById(`third-sbtn-${i}`);
            if(b) b.classList.toggle('active', thirdActiveStrings[i-1]);
        }
    }

    function selectedThirdStrings() {
        const arr = thirdActiveStrings.map((v,i) => v ? i+1 : null).filter(Boolean);
        return arr.length ? arr : [6];
    }

    function selectedThirdNotes() {
        return Array.from(new Set(getNotePool().map(canonicalNote)));
    }

    function buildThirdSeqQueue() {
        const strings = selectedThirdStrings().slice().sort((a,b) => b-a);
        const notes = selectedThirdNotes();
        thirdSeqQueue = [];
        notes.forEach(note => strings.forEach(s => thirdSeqQueue.push({ note, string: s })));
        thirdSeqIndex = 0;
    }

    function pickThirdTask() {
        const strings = selectedThirdStrings();
        let note;
        let string;

        if(thirdMode === 'SEQ') {
            if(thirdSeqQueue.length === 0 || thirdSeqIndex >= thirdSeqQueue.length) buildThirdSeqQueue();
            const task = thirdSeqQueue[thirdSeqIndex++];
            return { note: task.note, string: task.string };
        }

        if(thirdMode === 'FIXED_NOTE' || thirdMode === 'FIXED_BOTH') {
            const pool = thirdSelectedNotes;
            note = pool[Math.floor(Math.random() * pool.length)];
        } else {
            const pool = selectedThirdNotes();
            note = pool[Math.floor(Math.random() * pool.length)];
        }

        string = strings[Math.floor(Math.random() * strings.length)];
        return { note, string };
    }

    function getThirdTargets(rootString, rootFret, rootNote) {
        const target = transpose(rootNote, 4);
        const candidates = [];

        function pushTarget(s, f, label) {
            if(s < 1 || s > 6) return;
            // 3도 찾기는 루트를 누른 실제 프렛 기준의 공식 위치만 인정한다.
            // f가 음수라서 +12 해야 하는 먼 옥타브 위치는 이번 연습에서 제외한다.
            if(f < 0 || f > MAX_FRET) return;
            const node = getNodeAt(s, f);
            if(!node || !nodeMatchesNote(node, target)) return;
            const key = `${s}-${f}`;
            if(!candidates.some(t => t.key === key)) candidates.push({ s, f, label, key });
        }

        pushTarget(rootString, rootFret + 4, '같은 줄');

        if(rootString - 1 >= 1) {
            const thinOffset = (rootString === 3) ? 0 : -1; // 3번줄 → 2번줄 예외
            pushTarget(rootString - 1, rootFret + thinOffset, '한 줄 아래/얇은 쪽');
        }

        if(rootString + 1 <= 6) {
            const thickOffset = (rootString === 2) ? -4 : -3; // 2번줄 → 3번줄 예외
            pushTarget(rootString + 1, rootFret + thickOffset, '한 줄 위/두꺼운 쪽');
        }

        return { target, candidates };
    }

    function getNodeAt(s, f) {
        return document.querySelector(`.node[data-s="${s}"][data-f="${f}"]`);
    }

    function isThirdStringVisible(s) {
        if(thirdPhase === 'ROOT') return s === thirdRootString;
        return s === thirdRootString || thirdTargets.some(t => t.s === s);
    }

    function isThirdNodeDisabled(s, f) {
        if(f > MAX_FRET) return true;
        if(thirdPhase === 'ROOT') return s !== thirdRootString;
        return !(s === thirdRootString || thirdTargets.some(t => t.s === s));
    }

    function resetNodesForThird() {
        document.querySelectorAll('.node').forEach(n => {
            n.classList.remove('correct', 'wrong', 'root-found', 'third-found');
            n.innerText = "";
        });
    }

    function newThirdQuiz() {
        resetNodesForThird();
        const task = pickThirdTask();
        thirdRootNote = canonicalNote(task.note);
        thirdRootString = task.string;
        thirdRootFret = -1;
        thirdTargetNote = transpose(thirdRootNote, 4);
        thirdTargets = [];
        thirdPhase = 'ROOT';
        targetStrNum = thirdRootString;
        foundCount = 0;
        totalToFind = 1;

        document.getElementById('target-desc').innerHTML = `<span class="third-root-text">1단계</span> · ${thirdRootString}번줄에서 루트음을 직접 찾으세요`;
        document.getElementById('target-note').innerText = `${thirdRootString}번줄 ${noteLabel(thirdRootNote)}`;
        updateThirdStatus();
        updateUI();
    }

    function checkThird(n) {
        const f = parseInt(n.dataset.f);
        const s = parseInt(n.dataset.s);
        if(f > MAX_FRET || n.classList.contains('third-found')) return;

        if(thirdPhase === 'ROOT') {
            if(s === thirdRootString && nodeMatchesNote(n, thirdRootNote)) {
                n.classList.add('root-found');
                n.innerText = noteLabel(thirdRootNote);
                thirdRootFret = f;

                const result = getThirdTargets(thirdRootString, thirdRootFret, thirdRootNote);
                thirdTargetNote = result.target;
                thirdTargets = result.candidates;
                thirdPhase = 'THIRDS';
                foundCount = 0;
                totalToFind = thirdTargets.length;

                document.getElementById('target-desc').innerHTML = `<span class="third-target-text">2단계</span> · ${noteLabel(thirdRootNote)} 기준 장3도 ${noteLabel(thirdTargetNote)}를 동일줄/위줄/아래줄 중 잡을 수 있는 공식 위치만 찾으세요`;
                document.getElementById('target-note').innerText = `${noteLabel(thirdRootNote)} → 장3도 ${noteLabel(thirdTargetNote)}`;
                updateThirdStatus();
                updateUI();

                if(totalToFind === 0) setTimeout(newThirdQuiz, 500);
            } else {
                n.classList.add('wrong');
                n.innerText = n.dataset.n2 || n.dataset.n1;
                setTimeout(() => { n.classList.remove('wrong'); n.innerText = ""; }, 500);
            }
            return;
        }

        const target = thirdTargets.find(t => t.s === s && t.f === f);
        if(target) {
            n.classList.add('third-found');
            n.innerText = noteLabel(thirdTargetNote);
            foundCount++;
            updateThirdStatus();
            if(foundCount >= totalToFind) {
                setTimeout(newThirdQuiz, 800);
            }
        } else {
            n.classList.add('wrong');
            n.innerText = n.dataset.n2 || n.dataset.n1;
            setTimeout(() => { n.classList.remove('wrong'); n.innerText = ""; }, 500);
        }
    }

    function updateThirdStatus() {
        const modeLabel = {
            RANDOM: '랜덤',
            FIXED_NOTE: `정해진 음 ${thirdSelectedNotes.map(noteLabel).join(',')}`,
            FIXED_STRING: `정해진 줄 ${selectedThirdStrings().join(',')}번`,
            FIXED_BOTH: `${thirdSelectedNotes.map(noteLabel).join(',')} · ${selectedThirdStrings().join(',')}번줄`,
            SEQ: `순차 ${thirdSeqIndex}/${thirdSeqQueue.length || '-'}`
        }[thirdMode];

        if(thirdPhase === 'ROOT') {
            document.getElementById('status').innerText = `3도 찾기 · ${modeLabel} · 루트 찾기`;
        } else {
            const labels = thirdTargets.map(t => t.label).join(' / ');
            document.getElementById('status').innerText = `3도 찾기 · 남은 ${totalToFind - foundCount} · ${labels}`;
        }
    }


    function allStrings(v) { activeMulti = activeMulti.map(()=>v); updateUI(); newQuiz(); }

    init();
</script>
</body>
</html>
